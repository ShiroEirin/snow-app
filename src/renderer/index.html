    <style>
      html,
      body {
        font-family: var(
          --app-font-family,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif
        );
      }
      #boot-loader {
        --boot-bg: #ffffff;
        --boot-ink: 23, 23, 23;
        --boot-ease: cubic-bezier(0.22, 1, 0.36, 1);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        color: rgb(var(--boot-ink));
        transition:
          opacity 560ms cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0s linear 560ms;
      }
      #boot-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          560px circle at 50% 46%,
          rgba(var(--boot-ink), 0.045),
          transparent 70%
        );
        pointer-events: none;
      }
      @media (prefers-color-scheme: dark) {
        #boot-loader {
          --boot-bg: #0a0a0a;
          --boot-ink: 236, 236, 236;
        }
      }
      html[data-theme="light"] #boot-loader {
        --boot-bg: #ffffff;
        --boot-ink: 23, 23, 23;
      }
      html[data-theme="dark"] #boot-loader {
        --boot-bg: #0a0a0a;
        --boot-ink: 236, 236, 236;
      }
      html[data-theme-preset="cream"][data-theme="light"] #boot-loader {
        --boot-bg: #faf9f5;
        --boot-ink: 20, 20, 19;
      }
      html[data-theme-preset="cream"][data-theme="dark"] #boot-loader {
        --boot-bg: #141413;
        --boot-ink: 240, 238, 230;
      }
      html[data-theme-preset="cyberpunk"][data-theme="light"] #boot-loader {
        --boot-bg: #f0f0f2;
      }
      html[data-theme-preset="cyberpunk"][data-theme="dark"] #boot-loader {
        --boot-bg: #0a0a0f;
      }
      html[data-theme-preset="notion"][data-theme="light"] #boot-loader {
        --boot-bg: #ffffff;
        --boot-ink: 55, 53, 47;
      }
      html[data-theme-preset="notion"][data-theme="dark"] #boot-loader {
        --boot-bg: #191919;
        --boot-ink: 230, 230, 228;
      }
      #boot-loader.is-leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-stage {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(-3vh);
        transition: transform 560ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot-loader.is-leaving .boot-stage {
        transform: translateY(calc(-3vh - 8px)) scale(0.985);
      }
      .boot-mark {
        display: block;
        overflow: visible;
        -webkit-mask-image: linear-gradient(
          105deg,
          #000 42%,
          rgba(0, 0, 0, 0.35) 50%,
          #000 58%
        );
        -webkit-mask-size: 300% 100%;
        -webkit-mask-position: 100% 0;
        animation: boot-glint 3.6s cubic-bezier(0.45, 0, 0.25, 1) 1.3s infinite;
      }
      @keyframes boot-glint {
        0% {
          -webkit-mask-position: 100% 0;
        }
        55%,
        100% {
          -webkit-mask-position: 0% 0;
        }
      }
      .boot-glyph {
        opacity: 0;
        animation: boot-glyph-in 900ms var(--boot-ease) both;
      }
      .boot-glyph:nth-child(1) {
        animation-delay: 80ms;
      }
      .boot-glyph:nth-child(2) {
        animation-delay: 140ms;
      }
      .boot-glyph:nth-child(3) {
        animation-delay: 200ms;
      }
      .boot-glyph:nth-child(4) {
        animation-delay: 260ms;
      }
      .boot-glyph:nth-child(5) {
        animation-delay: 360ms;
      }
      .boot-glyph:nth-child(6) {
        animation-delay: 420ms;
      }
      .boot-glyph:nth-child(7) {
        animation-delay: 480ms;
      }
      @keyframes boot-glyph-in {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .boot-indicator {
        position: relative;
        width: 120px;
        height: 1px;
        margin-top: 34px;
        overflow: hidden;
        background: rgba(var(--boot-ink), 0.08);
        animation: boot-fade-in 800ms var(--boot-ease) 560ms both;
      }
      .boot-indicator::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 40px;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(var(--boot-ink), 0.6),
          transparent
        );
        transform: translateX(-40px);
        animation: boot-sweep 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-sweep {
        from {
          transform: translateX(-40px);
        }
        to {
          transform: translateX(120px);
        }
      }
      .boot-slogan {
        margin: 18px 0 0;
        font-size: 11px;
        font-weight: 400;
        line-height: 1.6;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        white-space: nowrap;
        color: rgba(var(--boot-ink), 0.42);
        animation: boot-fade-in 900ms var(--boot-ease) 680ms both;
      }
      .boot-slogan:lang(en) {
        font-size: 10px;
        letter-spacing: 0.2em;
        text-indent: 0.2em;
        text-transform: uppercase;
      }
      @keyframes boot-fade-in {
        from {
          opacity: 0;
          transform: translateY(3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-glyph,
        .boot-indicator,
        .boot-indicator::after,
        .boot-slogan {
          animation: none;
          opacity: 1;
        }
        #boot-loader,
        .boot-stage {
          transition: none;
        }
      }
    </style>
    <!-- 首帧字体走 bootFont 模块：页面 CSP 为 script-src 'self' blob:，内联脚本会被拒绝执行。 -->
    <script type="module" src="./boot-splash.ts"></script>
    <script type="module" src="./main.tsx"></script>
